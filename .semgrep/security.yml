# Project-authored rules, versioned with this sample. No third-party bundle.
# These checks cover common Node/Express/browser hazards; they are not a
# substitute for authentication, dependency review, or application threat review.
rules:
  - id: javascript-eval
    languages: [javascript, typescript]
    message: Avoid evaluating code strings.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: node-shell-command
    languages: [javascript, typescript]
    message: Use spawn/execFile with an argument array instead of a command shell.
    severity: ERROR
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: 'spawn(..., { ..., shell: true, ... })'
      - pattern: 'spawnSync(..., { ..., shell: true, ... })'
  - id: node-tls-verification-disabled
    languages: [javascript, typescript]
    message: TLS certificate verification must remain enabled.
    severity: ERROR
    pattern-either:
      - pattern: '$OBJ = { ..., rejectUnauthorized: false, ... }'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - id: node-weak-hash
    languages: [javascript, typescript]
    message: Do not use MD5 or SHA-1 for security decisions.
    severity: ERROR
    pattern-either:
      - pattern: $CRYPTO.createHash("md5", ...)
      - pattern: $CRYPTO.createHash("sha1", ...)
  - id: express-request-to-html
    languages: [javascript, typescript]
    message: Encode request-derived content before sending HTML.
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
          - pattern: $REQ.header(...)
    pattern-sinks:
      - pattern: $RES.send(...)
  - id: express-request-to-redirect
    languages: [javascript, typescript]
    message: Validate a request-derived redirect against allowed destinations.
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - pattern: $RES.redirect(...)
  - id: express-request-to-file
    languages: [javascript, typescript]
    message: Resolve user file paths inside a fixed directory.
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - pattern-either:
          - pattern: $RES.sendFile(...)
          - pattern: $RES.download(...)
  - id: react-raw-html
    languages: [javascript, typescript]
    message: Render text through React escaping instead of inserting raw HTML.
    severity: ERROR
    pattern: <$TAG ... dangerouslySetInnerHTML={...} ... />
  - id: browser-raw-html
    languages: [javascript, typescript]
    message: Use textContent or escaped DOM construction instead of raw HTML.
    severity: ERROR
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: document.write(...)
      - pattern: $ELEMENT.insertAdjacentHTML(...)
  - id: browser-postmessage-any-origin
    languages: [javascript, typescript]
    message: Send browser messages only to an explicit trusted origin.
    severity: ERROR
    pattern: $WINDOW.postMessage($MESSAGE, "*", ...)
